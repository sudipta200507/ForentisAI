[project]
name = "forentisai-email-extraction"
version = "0.1.0"
description = "Step 1 email data extraction engine for ForentisAI"
requires-python = ">=3.11"
dependencies = [
    "mail-parser==4.6.4",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "fastapi==0.129.0",
    "uvicorn==0.41.0",
    "python-multipart==0.0.20",
    "dnspython==2.8.0",
    "geoip2==5.1.0",
    # V1 production artifact pickled with sklearn 1.6.1; loader smoke-tests
    # the estimator after unpickling (see docs/model_compatibility.md).
    "scikit-learn>=1.6,<1.9",
    "numpy>=2.1",
    "joblib>=1.4",
    "shap==0.48.0",
    "torch==2.14.0+cpu",
    "transformers==4.57.1",
    "tokenizers>=0.22",
    "sentencepiece>=0.2",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: controlled live integration tests (real DNS/RDAP); opt in with -m live",
]
