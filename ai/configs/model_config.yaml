# ForentisAI Step 5 model configuration (documentation of defaults).
#
# Runtime configuration is environment-variable based (see
# backend/app/core/config.py, AISettings). This file documents the defaults
# and is NOT read by the application; it exists so operators can see the
# intended layout at a glance.
#
# Environment variables:
#   AI_ENABLED                     default: true
#   AI_MODEL_DIR                   default: ai/models (relative to project root)
#   TECHNICAL_MODEL_PATH           default: $AI_MODEL_DIR/technical_model.joblib
#   NLP_MODEL_PATH                 default: ai/models/nlp/forentisai_deberta_v3
#                                  (the official fine-tuned ForentisAI artifact,
#                                  resolved against the project root; a missing
#                                  or invalid artifact is an explicit
#                                  unavailable state, never a download)
#   NLP_MODEL_NAME                 default: microsoft/deberta-v3-base (the BASE
#                                  model is never used for prediction; this
#                                  names what the production artifact was
#                                  trained from)
#   AI_MAX_TEXT_LENGTH             default: 6000 characters
#   AI_INFERENCE_TIMEOUT_SECONDS   default: 20.0
#
# Artifacts in this repository:
#   technical_model.joblib         production technical model (to be trained on
#                                  a real labeled dataset; does not exist yet)
#   technical_model_fixture.joblib pipeline-validation fixture model (trained on
#                                  synthetic data; NOT a production model)
#   nlp/forentisai_deberta_v3/     the official fine-tuned ForentisAI
#                                  DeBERTa-v3 email-threat classifier
#                                  (184,423,682 parameters, trained from
#                                  microsoft/deberta-v3-base on
#                                  ForentisAI_DeBERTa_Dataset_V2). Local,
#                                  git-ignored deployment artifact; must
#                                  contain forentisai_model.json with
#                                  "forentisai_model": true and
#                                  "model_type":
#                                  "deberta_v3_email_threat_classifier".
#
# Honesty rules: no accuracy metric from the fixture model may be reported
# as real-world performance. The NLP artifact's held-out V2 test metrics
# (1.000 on 4,499 samples) come from a SYNTHETIC dataset and do NOT
# establish real-world performance; independent real-email evaluation is
# still required. See ai/datasets/README.md.
